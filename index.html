<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker do Serafim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: faixa de feltro no topo com o nome do grupo; abaixo, abas e painéis tabulares. Números sempre em mono. */
:root{
  --bg:#f1f3ef; --surface:#ffffff; --surface-2:#f6f7f3; --ink:#17221b; --muted:#5d6b62; --line:#dde3db;
  --felt:#173e2a; --felt-2:#1f4d35; --felt-ink:#eef3ea; --gold:#a07c26; --gold-soft:#f3e8cc;
  --good:#2c7549; --good-soft:#e0efe5; --warn:#9c6410; --warn-soft:#f7ebd4; --bad:#ad3e2d; --bad-soft:#f6e0db;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1410; --surface:#151f19; --surface-2:#1a261f; --ink:#e3eae4; --muted:#93a399; --line:#26332a;
    --felt:#0f2a1c; --felt-2:#153624; --felt-ink:#e8eee5; --gold:#d4ae58; --gold-soft:#372f1d;
    --good:#6cbf8c; --good-soft:#1b3224; --warn:#e2a750; --warn-soft:#382b16; --bad:#e3826f; --bad-soft:#3a201b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1410; --surface:#151f19; --surface-2:#1a261f; --ink:#e3eae4; --muted:#93a399; --line:#26332a;
  --felt:#0f2a1c; --felt-2:#153624; --felt-ink:#e8eee5; --gold:#d4ae58; --gold-soft:#372f1d;
  --good:#6cbf8c; --good-soft:#1b3224; --warn:#e2a750; --warn-soft:#382b16; --bad:#e3826f; --bad-soft:#3a201b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* topo */
.top{background:var(--felt);color:var(--felt-ink);background-image:radial-gradient(ellipse at 20% 0%, var(--felt-2), transparent 70%)}
.top .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:14px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;letter-spacing:.2px}
.brand .suits{color:var(--gold);letter-spacing:4px;font-size:14px}
.top-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.top select,.top .ghost{background:transparent;border:1px solid color-mix(in srgb, var(--felt-ink) 30%, transparent);color:var(--felt-ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.top select option{color:#17221b;background:#fff}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:color-mix(in srgb, var(--felt-ink) 70%, transparent);padding:10px 12px 12px;cursor:pointer;white-space:nowrap;font-weight:500;border-bottom:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--felt-ink);border-bottom-color:var(--gold)}
.demo-bar{background:var(--gold-soft);color:var(--ink);font-size:13px}
.demo-bar .wrap{padding-block:8px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.demo-bar button{background:none;border:1px solid var(--gold);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:12px}

main.wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-pad{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:19px;font-weight:600}
.stat .s{font-size:13px;color:var(--muted)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--felt);color:var(--felt-ink)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:30px;height:30px;cursor:pointer;display:inline-grid;place-items:center}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}

/* ficha de posição */
.chip{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--f-num);font-weight:600;font-size:13px;border:2px dashed transparent;background:var(--surface-2);color:var(--muted)}
.chip.p1{background:var(--gold);color:#1b1505;border-color:color-mix(in srgb,#fff 55%,transparent)}
.chip.p2{background:#9aa5a0;color:#111;border-color:color-mix(in srgb,#fff 55%,transparent)}
.chip.p3{background:#a86b45;color:#fff;border-color:color-mix(in srgb,#fff 45%,transparent)}
.pts{font-family:var(--f-num);font-weight:600;font-size:17px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.plain{background:var(--surface-2);color:var(--muted)}

.weeks{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.wk{font-family:var(--f-num);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--surface)}
.wk b{font-weight:600}
.wk.off{opacity:.45;text-decoration:line-through}
.wk.fin{border-color:var(--gold);background:var(--gold-soft)}

.ev-list{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.ev:last-child{border-bottom:0}
.ev:hover{background:var(--surface-2)}
.ev .date{font-family:var(--f-num);font-size:13px;width:70px;color:var(--muted)}
.ev .who{min-width:0}
.ev .who strong{display:block}
.ev .who span{font-size:13px;color:var(--muted)}
.ev-detail{background:var(--surface-2);border-bottom:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.two>*{min-width:0}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input.cell{width:84px;padding:5px 7px;text-align:right;font-family:var(--f-num)}
input.cell.pos{width:58px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--felt)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.row-off td{opacity:.45}
.err{color:var(--bad);font-size:14px}
.cfg-group{display:flex;flex-direction:column;gap:8px}
.cfg-t{font-weight:600;font-size:14px}
.note{font-size:13px;color:var(--muted)}

.pay td.cell{padding:5px;text-align:center}
.pay .pc{width:38px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:12px;font-weight:600}
.pay button.pc{cursor:pointer}
.pay .pc.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pay .pc.late{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pay .pc.soon{color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

.order{list-style:none;margin:0;padding:0}
.order li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.order li:last-child{border-bottom:0}
.order .n{font-family:var(--f-num);color:var(--muted);width:22px}
.order .nm{flex:1;min-width:0}
.order .nm small{display:block;color:var(--muted);font-size:12px}
.order li.next{background:var(--gold-soft)}

.big{font-family:var(--f-display);font-size:32px;line-height:1.1}
.login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .hide-sm{display:none}
  .brand h1{font-size:22px}
  th,td{padding:8px 7px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// =====================================================================
// CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
// (Project Settings → API). Com os dois vazios, o app abre em modo
// demonstração com dados de exemplo salvos só no navegador.
// =====================================================================
const SUPABASE_URL = "https://okvzujswoziqsnapwdtq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rdnp1anN3b3ppcXNuYXB3ZHRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDAzNjgsImV4cCI6MjEwNzkxNjM2OH0.s8QTn3xBpKv3fXFX4JNk6w1TCWTqaVK4snQpTroqI0A";
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY;

// Regras padrão (Regulamento 2027). Cada temporada pode sobrescrever na aba Admin.
const DEFAULT_CFG = {
  fee: 200, installments: 10, first_month: 1, weekday: 4, top_n: 15,
  cash:          { buyin: 50,  chips: 5000,  limit: 7 },
  final_cash:    { buyin: 100, chips: 10000, limit: 6 },
  tourney:       { buyin: 150, rebuy: 150, split: [50, 30, 20] },
  final_tourney: { buyin: 500, rebuy: 500, split: [60, 30, 10] },
  prizes:        { cash: [5000, 3000, 2000], tourney: [5000, 3000, 2000] },
  special:       { quadra: 20, straight_flush: 50, royal: 100 }
};
const HAND_LABEL = { quadra: "Quadra", straight_flush: "Straight flush", royal: "Royal straight flush" };
const WD = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MON = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const TABLES = { players:"players", seasons:"seasons", events:"events", cash:"cash_results", tourney:"tourney_results", hands:"special_hands", payments:"payments", statements:"statements" };

const S = {
  players:[], seasons:[], events:[], cash:[], tourney:[], hands:[], payments:[], statements:[],
  seasonId:null, tab:"ranking", rankType:"cash", me:null, asPlayer:false,
  openEvent:null, editing:null, expanded:null, urls:{}, loginMsg:"", signup:false, busy:false
};
let sb = null;

// ---------- utilidades ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function parseMoney(v){
  let s = String(v ?? "").replace(/R\$|\s/g, "");
  if (!s) return NaN;
  const neg = s.startsWith("-"); s = s.replace(/^[-+]/, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return isNaN(n) ? NaN : (neg ? -n : n);
}
const moneyIn = n => (n == null || n === "") ? "" : Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brlSigned = n => (n>0?"+":"") + brl(n);
const fnum = n => (Number(n)||0).toLocaleString("pt-BR");
const pd = s => { const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const dd = d => `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
const fmtD = s => { const d = pd(s); return `${WD[d.getDay()].slice(0,3)}, ${dd(d)}`; };
const fmtDY = s => { const d = pd(s); return `${dd(d)}/${d.getFullYear()}`; };
const season = () => S.seasons.find(s => s.id === S.seasonId);
const player = id => S.players.find(p => p.id === id);
const pname = id => player(id)?.name || "—";
const isAdmin = () => !!S.me?.admin && !S.asPlayer;
const byDate = (a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id;
const seasonEvents = () => S.events.filter(e => e.season_id === S.seasonId).sort(byDate);
const activePlayers = () => S.players.filter(p => p.active !== false).sort((a,b) => a.name.localeCompare(b.name,"pt-BR"));

function cfg(){
  const out = JSON.parse(JSON.stringify(DEFAULT_CFG));
  const c = season()?.config || {};
  for (const k in c){
    if (c[k] && typeof c[k] === "object" && !Array.isArray(c[k])) out[k] = { ...out[k], ...c[k] };
    else out[k] = c[k];
  }
  return out;
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}

// ---------- camada de dados (Supabase ou demonstração) ----------
const DEMO_KEY = "serafim-demo-v1";
function demoSave(){ try { const d = {}; for (const k in TABLES) d[k] = S[k]; localStorage.setItem(DEMO_KEY, JSON.stringify(d)); } catch(e){} }
function demoLoad(){
  try { const raw = localStorage.getItem(DEMO_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return demoSeed();
}
function nextId(k){ return S[k].reduce((m,r) => Math.max(m, r.id||0), 0) + 1; }
const matches = (row, m) => Object.entries(m).every(([c,v]) => row[c] === v);

const api = {
  async loadAll(){
    if (DEMO){ Object.assign(S, demoLoad()); return; }
    const res = await Promise.all(Object.entries(TABLES).map(async ([k,t]) => {
      const { data, error } = await sb.from(t).select("*");
      if (error) throw error;
      return [k, data];
    }));
    res.forEach(([k,d]) => S[k] = d);
  },
  async insert(k, row){
    if (DEMO){ const r = { ...row, id: nextId(k) }; S[k].push(r); demoSave(); return r; }
    const { data, error } = await sb.from(TABLES[k]).insert(row).select().single();
    if (error) throw error; S[k].push(data); return data;
  },
  async insertMany(k, rows){
    if (!rows.length) return [];
    if (DEMO){ S[k].push(...rows); demoSave(); return rows; }
    const { data, error } = await sb.from(TABLES[k]).insert(rows).select();
    if (error) throw error; S[k].push(...data); return data;
  },
  async update(k, id, patch){
    if (DEMO){ const r = S[k].find(x => x.id === id); Object.assign(r, patch); demoSave(); return r; }
    const { data, error } = await sb.from(TABLES[k]).update(patch).eq("id", id).select().single();
    if (error) throw error; const i = S[k].findIndex(x => x.id === id); S[k][i] = data; return data;
  },
  async upsert(k, row, keys){
    const m = Object.fromEntries(keys.map(c => [c, row[c]]));
    if (DEMO){ const i = S[k].findIndex(x => matches(x, m)); if (i >= 0) S[k][i] = { ...S[k][i], ...row }; else S[k].push(row); demoSave(); return row; }
    const { data, error } = await sb.from(TABLES[k]).upsert(row, { onConflict: keys.join(",") }).select().single();
    if (error) throw error; const i = S[k].findIndex(x => matches(x, m)); if (i >= 0) S[k][i] = data; else S[k].push(data); return data;
  },
  async del(k, m){
    if (!DEMO){ let q = sb.from(TABLES[k]).delete(); for (const [c,v] of Object.entries(m)) q = q.eq(c, v); const { error } = await q; if (error) throw error; }
    S[k] = S[k].filter(x => !matches(x, m)); if (DEMO) demoSave();
  },
  async upload(file, path){
    if (DEMO){
      const data = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(file); });
      try { localStorage.setItem("serafim-demo-file:" + path, data); } catch(e){ throw new Error("Arquivo grande demais para o modo demonstração."); }
      return path;
    }
    const { error } = await sb.storage.from("extratos").upload(path, file, { upsert: true });
    if (error) throw error; return path;
  },
  async fileUrl(path){
    if (DEMO){ try { return localStorage.getItem("serafim-demo-file:" + path); } catch(e){ return null; } }
    const { data, error } = await sb.storage.from("extratos").createSignedUrl(path, 3600);
    return error ? null : data.signedUrl;
  }
};

// ---------- regras de pontuação ----------
// Cash: classificação pelo resultado do dia (fichas finais − cacifes).
// 1º leva N pontos (N = presentes), último leva 1. Passou do limite de cacifes ou ficou < 2h: 0 ponto.
function cashResults(ev){
  const c = ev.is_final ? cfg().final_cash : cfg().cash;
  const per = c.buyin / c.chips;
  // Quem estoura o limite de cacifes (ou fica < 2h) vai para o fim da classificação com 0 ponto;
  // todos os demais presentes passam à frente dele.
  const arr = S.cash.filter(r => r.event_id === ev.id)
    .map(r => ({ r, lucro: Math.round((r.final_chips * per - r.buyins * c.buyin) * 100) / 100,
                 reason: r.buyins > c.limit ? `passou de ${c.limit} cacifes` : !r.hours_ok ? "menos de 2h" : "" }))
    .sort((a,b) => (!!a.reason - !!b.reason) || b.lucro - a.lucro);
  const N = arr.length, out = {};
  arr.forEach((a, i) => {
    const first = a.reason ? i : arr.findIndex(x => !x.reason && x.lucro === a.lucro);
    const pts = a.reason ? 0 : N - first;
    out[a.r.player_id] = { pts, pos: first + 1, lucro: a.lucro, buyins: a.r.buyins, chips: a.r.final_chips, reason: a.reason, invested: a.r.buyins * c.buyin };
  });
  return out;
}
// Torneio: posição informada. 1º leva N pontos, último 1. Prêmio do dia pela divisão configurada.
function tourneyResults(ev){
  const c = ev.is_final ? cfg().final_tourney : cfg().tourney;
  const rows = S.tourney.filter(r => r.event_id === ev.id);
  const N = rows.length, rebuys = rows.filter(r => r.rebuy).length;
  const pool = N * c.buyin + rebuys * c.rebuy, out = {};
  rows.forEach(r => {
    const pos = Number(r.position) || null;
    const pts = pos ? Math.max(0, N - pos + 1) : 0;
    const prize = pos && pos <= c.split.length ? Math.round(pool * c.split[pos-1]) / 100 : 0;
    out[r.player_id] = { pts, pos, rebuy: r.rebuy, prize };
  });
  return { out, pool, N, rebuys };
}
function standings(type){
  const c = cfg(), per = {};
  for (const ev of seasonEvents().filter(e => e.status === "realizado")){
    const res = type === "cash" ? cashResults(ev) : tourneyResults(ev).out;
    for (const [pid, r] of Object.entries(res)){
      const p = per[pid] ||= { pid: Number(pid), reg: [], final: null };
      if (ev.is_final) p.final = r.pts * 2;
      else p.reg.push({ ev, pts: r.pts, reason: r.reason });
    }
  }
  const rows = Object.values(per).map(p => {
    const sorted = [...p.reg].sort((a,b) => b.pts - a.pts || byDate(a.ev, b.ev));
    const keep = sorted.slice(0, c.top_n);
    const top = keep.reduce((s,x) => s + x.pts, 0);
    const all = p.reg.reduce((s,x) => s + x.pts, 0);
    return { ...p, kept: new Set(keep.map(x => x.ev.id)), top, total: top + (p.final || 0), bruto: all + (p.final || 0), played: p.reg.length, discarded: Math.max(0, p.reg.length - c.top_n) };
  });
  rows.sort((a,b) => b.total - a.total || b.bruto - a.bruto || pname(a.pid).localeCompare(pname(b.pid),"pt-BR"));
  let rank = 0;
  rows.forEach((r,i) => { if (i === 0 || r.total !== rows[i-1].total || r.bruto !== rows[i-1].bruto) rank = i + 1; r.rank = rank; });
  return rows;
}

// ---------- rodízio de casas ----------
function hostOrder(){ return (season()?.host_order || []).filter(id => player(id) && player(id).active !== false); }
function upcoming(n){
  // Próxima casa = quem recebeu menos vezes na temporada; empate decidido pela ordem fixa.
  // Assim, se uma semana acontece numa casa trocada, quem foi pulado volta a ser o próximo.
  const order = hostOrder(), c = cfg(), t = iso(today());
  const evs = seasonEvents().filter(e => e.status !== "cancelado");
  const out = evs.filter(e => e.date >= t && e.status === "agendado").slice(0, n).map(e => ({ date: e.date, host: e.host_id, ev: e }));
  if (out.length >= n || !order.length) return out;
  const counts = hostCounts(true);
  const last = evs[evs.length - 1];
  const yesterday = new Date(today()); yesterday.setDate(yesterday.getDate() - 1);
  let d = last && pd(last.date) > yesterday ? pd(last.date) : yesterday;
  while (out.length < n){
    d = new Date(d); d.setDate(d.getDate() + 1);
    while (d.getDay() !== Number(c.weekday)) d.setDate(d.getDate() + 1);
    const pick = order.reduce((best, id) => counts[id] < counts[best] ? id : best, order[0]);
    counts[pick]++;
    out.push({ date: iso(d), host: pick, projected: true });
  }
  return out;
}
// Quantas vezes cada casa da ordem recebeu nesta temporada (com ou sem os agendamentos futuros)
function hostCounts(withScheduled){
  const t = iso(today()), counts = Object.fromEntries(hostOrder().map(id => [id, 0]));
  for (const e of seasonEvents()){
    if (!(e.host_id in counts)) continue;
    if (e.status === "realizado" || (withScheduled && e.status === "agendado" && e.date >= t)) counts[e.host_id]++;
  }
  return counts;
}

// ---------- mensalidades ----------
function installments(){
  const c = cfg(), y = season()?.year || today().getFullYear(), list = [];
  for (let i = 1; i <= c.installments; i++){
    const m0 = Number(c.first_month) - 1 + (i - 1);
    const yy = y + Math.floor(m0 / 12), mm = m0 % 12;
    list.push({ i, label: MON[mm], year: yy, due: new Date(yy, mm + 1, 0) });
  }
  return list;
}
function payStatus(pid, inst){
  const p = S.payments.find(x => x.season_id === S.seasonId && x.player_id === pid && x.installment === inst.i);
  if (p) return { s: "ok", p };
  return { s: today() > inst.due ? "late" : "soon" };
}

  const E = { ev: ev ? { ...ev } : null, cash: {}, tourney: {}, hands: [], err: "" , confirmDel:false};

    E.ev = { date: nx ? nx.date : iso(today()), host_id: nx ? nx.host : (activePlayers()[0]?.id ?? null), is_final: false, status: "realizado", notes: "" };
    const sched = nx?.ev; if (sched){ E.ev = { ...sched, status: "realizado" }; }
  }
  const ids = new Set(activePlayers().map(p => p.id));
  if (E.ev.id){
    S.cash.filter(r => r.event_id === E.ev.id).forEach(r => ids.add(r.player_id));
    S.tourney.filter(r => r.event_id === E.ev.id).forEach(r => ids.add(r.player_id));
  }
  for (const id of ids){
    const c = E.ev.id && S.cash.find(r => r.event_id === E.ev.id && r.player_id === id);
    const t = E.ev.id && S.tourney.find(r => r.event_id === E.ev.id && r.player_id === id);
    E.cash[id] = c ? { present: true, buyins: c.buyins, chips: c.final_chips, short: !c.hours_ok } : { present: false, buyins: 1, chips: 0, short: false };
    E.tourney[id] = t ? { present: true, position: t.position ?? "", rebuy: t.rebuy } : { present: false, position: "", rebuy: false };
  }
  if (E.ev.id) E.hands = S.hands.filter(h => h.event_id === E.ev.id).map(h => ({ player_id: h.player_id, kind: h.kind }));
  S.editing = E;
}

function chipCheck(){
  const E = S.editing, cc = E.ev.is_final ? cfg().final_cash : cfg().cash;

  for (const r of Object.values(E.cash)) if (r.present){ bought += (Number(r.buyins)||0) * cc.chips; counted += Number(r.chips)||0; }

  return `Compradas ${fnum(bought)} · contadas ${fnum(counted)} ${diff ? `<span class="pill warn">diferença ${fnum(diff)}</span>` : bought ? `<span class="pill good">fecha</span>` : ""}`;

async function saveEvent(){
  const E = S.editing, ev = E.ev;
  E.err = "";
  if (!ev.date){ E.err = "Informe a data."; return render(); }
  const realized = ev.status === "realizado";
  const cash = Object.entries(E.cash).filter(([,r]) => r.present && realized);
  const tour = Object.entries(E.tourney).filter(([,r]) => r.present && realized);
  if (realized){
    const pos = tour.map(([,r]) => Number(r.position));
    const n = tour.length;
    if (pos.some(p => !p || p < 1 || p > n)) { E.err = `No torneio, cada presente precisa de uma posição de 1 a ${n}.`; return render(); }
    if (new Set(pos).size !== pos.length) { E.err = "No torneio há posições repetidas."; return render(); }
    if (cash.some(([,r]) => !(Number(r.buyins) >= 1))) { E.err = "No cash, cada presente precisa de pelo menos 1 cacife."; return render(); }
  }
  S.busy = true; render();
  try {
    const row = { season_id: S.seasonId, date: ev.date, host_id: ev.host_id ? Number(ev.host_id) : null, is_final: !!ev.is_final, status: ev.status, notes: ev.notes || null };
    const saved = ev.id ? await api.update("events", ev.id, row) : await api.insert("events", row);
    await api.del("cash", { event_id: saved.id });
    await api.del("tourney", { event_id: saved.id });
    await api.del("hands", { event_id: saved.id });
    await api.insertMany("cash", cash.map(([id,r]) => ({ event_id: saved.id, player_id: Number(id), buyins: Number(r.buyins), final_chips: Number(r.chips)||0, hours_ok: !r.short })));
    await api.insertMany("tourney", tour.map(([id,r]) => ({ event_id: saved.id, player_id: Number(id), position: Number(r.position), rebuy: !!r.rebuy })));
    if (realized && E.hands.length){
      if (DEMO){ for (const h of E.hands) await api.insert("hands", { event_id: saved.id, ...h }); }
      else await api.insertMany("hands", E.hands.map(h => ({ event_id: saved.id, ...h })));
    }
    S.editing = null; S.openEvent = saved.id; toast("Semana salva");
  } catch(e){ E.err = "Não foi possível salvar: " + (e.message || e); }
  S.busy = false; render();
}

async function loadUrls(){
  const paths = S.statements.filter(s => s.season_id === S.seasonId && s.file_path && !(s.file_path in S.urls)).map(s => s.file_path);

  for (const p of paths) S.urls[p] = await api.fileUrl(p) || "";
  if (S.tab === "caixa") render();
}

      <label class="f" for="cf-fcc">Fichas por cacife no final<input id="cf-fcc" type="number" step="100" value="${c.final_cash.chips}"></label>
      <label class="f" for="cf-fcl">Limite de cacifes no final<input id="cf-fcl" type="number" min="1" value="${c.final_cash.limit}"></label>
    </div></div>
    <div class="cfg-group"><div class="cfg-t">Torneio</div><div class="form-grid">
      <label class="f" for="cf-tb">Buy-in semanal (R$)<input id="cf-tb" type="number" step="0.01" value="${c.tourney.buyin}"></label>
      <label class="f" for="cf-tr">Re-buy semanal (R$)<input id="cf-tr" type="number" step="0.01" value="${c.tourney.rebuy}"></label>
      <label class="f" for="cf-ts">Divisão do prêmio do dia (%)<input id="cf-ts" type="text" value="${c.tourney.split.join(", ")}"></label>
      <label class="f" for="cf-ftb">Buy-in no dia final (R$)<input id="cf-ftb" type="number" step="0.01" value="${c.final_tourney.buyin}"></label>
      <label class="f" for="cf-ftr">Re-buy no dia final (R$)<input id="cf-ftr" type="number" step="0.01" value="${c.final_tourney.rebuy}"></label>
      <label class="f" for="cf-fts">Divisão no dia final (%)<input id="cf-fts" type="text" value="${c.final_tourney.split.join(", ")}"></label>
    </div></div>
    <div class="cfg-group"><div class="cfg-t">Prêmios do campeonato e mãos especiais</div><div class="form-grid">
      <label class="f" for="cf-pc">Campeonato cash (1º, 2º, 3º…)<input id="cf-pc" type="text" value="${c.prizes.cash.join(", ")}"></label>
      <label class="f" for="cf-pt">Campeonato torneio (1º, 2º, 3º…)<input id="cf-pt" type="text" value="${c.prizes.tourney.join(", ")}"></label>
      <label class="f" for="cf-hq">Quadra (R$ por presente)<input id="cf-hq" type="number" step="0.01" value="${c.special.quadra}"></label>
      <label class="f" for="cf-hs">Straight flush (R$)<input id="cf-hs" type="number" step="0.01" value="${c.special.straight_flush}"></label>
      <label class="f" for="cf-hr">Royal straight flush (R$)<input id="cf-hr" type="number" step="0.01" value="${c.special.royal}"></label>
    </div></div>
    <div id="cfg-err" class="err" hidden></div>
    <div><button class="btn primary" type="submit">Salvar regras de ${s.year}</button></div>
    <p class="note" style="margin:0">Mudar as regras recalcula na hora a pontuação e os prêmios já lançados desta temporada. As outras temporadas não mudam.</p>
  </form>`;
}

// EVENTOS
// =====================================================================
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  try {
    switch (act){
      case "tab": S.tab = v; S.editing = null; S.editStmt = null; render(); window.scrollTo(0,0); break;
      case "rank": S.rankType = v; render(); break;
      case "expand": S.expanded = S.expanded === v ? null : v; render(); break;
      case "open-event": S.openEvent = S.openEvent === Number(v) ? null : Number(v); render(); break;
      case "new-event": startEditor(null); render(); break;
      case "edit-event": startEditor(S.events.find(x => x.id === Number(v))); render(); break;
      case "cancel-edit": S.editing = null; render(); break;
      case "save-event": await saveEvent(); break;
      case "del-event": {
        if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Confirmar exclusão"; return; }
        await api.del("events", { id: Number(v) });
        S.cash = S.cash.filter(r => r.event_id !== Number(v)); S.tourney = S.tourney.filter(r => r.event_id !== Number(v)); S.hands = S.hands.filter(r => r.event_id !== Number(v));
        if (DEMO) demoSave();
        S.openEvent = null; toast("Semana excluída"); render(); break;
      }
      case "add-hand": S.editing.hands.push({ player_id: Number(document.getElementById("h-player").value), kind: document.getElementById("h-kind").value }); render(); break;
      case "rm-hand": S.editing.hands.splice(Number(v), 1); render(); break;
      case "mv-host": { const o = [...hostOrder()], i = o.indexOf(Number(v)), j = i + Number(el.dataset.d); [o[i], o[j]] = [o[j], o[i]]; await setOrder(o); break; }
      case "rm-host": await setOrder(hostOrder().filter(id => id !== Number(v))); break;
      case "add-host": await setOrder([...hostOrder(), Number(v)]); break;
      case "pay": {
        const pid = Number(el.dataset.p), i = Number(el.dataset.i);
        const ex = S.payments.find(x => x.season_id === S.seasonId && x.player_id === pid && x.installment === i);
        if (ex) await api.del("payments", { season_id: S.seasonId, player_id: pid, installment: i });
        else await api.upsert("payments", { season_id: S.seasonId, player_id: pid, installment: i, paid_on: iso(today()), amount: cfg().fee }, ["season_id","player_id","installment"]);
        render(); break;
      }
      case "edit-stmt": S.editStmt = Number(v); render(); document.getElementById("stmt-form")?.scrollIntoView({ behavior: "smooth" }); break;
      case "cancel-stmt": S.editStmt = null; render(); break;
      case "del-stmt": {
        if (el.dataset.confirm !== "1"){ el.dataset.confirm = "1"; el.textContent = "Confirmar"; return; }
        await api.del("statements", { id: Number(v) }); toast("Extrato excluído"); render(); break;
      }
      case "new-season": await createSeason(S.seasons.length ? Math.max(...S.seasons.map(x => x.year)) + 1 : today().getFullYear()); break;
      case "new-season-year": {
        const y = Number(document.getElementById("ns-year").value);
        if (!(y >= 2000 && y <= 2100)) { toast("Informe um ano válido, ex.: 2026"); break; }
        await createSeason(y); break;
      }
      case "go-season": S.seasonId = Number(v); S.editing = null; S.openEvent = null; render(); break;
      case "logout": await sb.auth.signOut(); S.me = null; render(); break;
      case "toggle-signup": S.signup = !S.signup; S.loginMsg = ""; render(); break;
      case "asplayer": S.asPlayer = !S.asPlayer; S.editing = null; render(); break;
      case "reset-demo": try { localStorage.removeItem(DEMO_KEY); } catch(_){} Object.assign(S, demoSeed()); S.editing = null; pickSeason(); render(); toast("Exemplo recarregado"); break;
    }
  } catch(err){ toast("Erro: " + (err.message || err)); }
});

document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "season-sel"){ S.seasonId = Number(el.value); S.editing = null; S.openEvent = null; render(); return; }
  if (el.dataset.ed) { bindEditor(el); if (el.dataset.rerender) render(); return; }
  if (el.dataset.pl){
    const id = Number(el.dataset.pl), f = el.dataset.f;
    let val = el.type === "checkbox" ? el.checked : el.value.trim();
    if (f === "email") val = val ? val.toLowerCase() : null;
    try { await api.update("players", id, { [f]: val }); toast("Jogador atualizado"); if (el.type === "checkbox") render(); }
    catch(err){ toast("Erro: " + (err.message || err)); }
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "st-bal" || el.id === "st-yield"){
    const out = document.getElementById(el.id + "-v"), n = parseMoney(el.value);
    if (out) out.textContent = !el.value.trim() ? "" : isNaN(n) ? "valor não reconhecido" : brl(n);
  }
  if (el.dataset.ed && el.type !== "checkbox" && el.tagName !== "SELECT"){ bindEditor(el); const cc = document.getElementById("chipcheck"); if (cc) cc.innerHTML = chipCheck(); }
});
function bindEditor(el){
  const E = S.editing; if (!E) return;
  const [scope, a, b] = el.dataset.ed.split(".");
  let val = el.type === "checkbox" ? el.checked : el.value;
  if (scope === "ev"){
    if (a === "host_id") val = Number(val);
    if (a === "is_final") val = val === "1";
    E.ev[a] = val;
    if (a === "status") render();
  } else {
    E[scope][a][b] = val;
  }
}

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  try {
    if (f.id === "login-form"){
      const email = document.getElementById("lg-email").value.trim().toLowerCase(), password = document.getElementById("lg-pass").value;
      S.loginEmail = email; S.busy = true; S.loginMsg = ""; render();
      const r = S.signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
      S.busy = false;
      if (r.error){ S.loginMsg = r.error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : r.error.message; return render(); }
      if (!r.data.session){ S.loginMsg = "Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre."; S.signup = false; return render(); }
      await afterLogin(r.data.session);
    }
    if (f.id === "add-player"){
      const name = document.getElementById("np-name").value.trim(), email = document.getElementById("np-email").value.trim().toLowerCase();
      if (!name) return;
      await api.insert("players", { name, email: email || null, is_admin: false, active: true });
      toast(`${name} adicionado`); render();
    }
    if (f.id === "cfg-form"){
      const s = season(), cur = s.config || {};
      const n = id => Number(document.getElementById(id).value);
      const list = id => document.getElementById(id).value.split(/[;,\s]+/).map(x => Number(x.replace(",", "."))).filter(x => !isNaN(x) && x > 0);
      const err = document.getElementById("cfg-err");
      const ts = list("cf-ts"), fts = list("cf-fts");
      const bad = [["Divisão do prêmio do dia", ts], ["Divisão no dia final", fts]].find(([,l]) => Math.round(l.reduce((a,b) => a + b, 0)) !== 100);
      if (bad){ err.textContent = `${bad[0]} precisa somar 100% (hoje soma ${bad[1].reduce((a,b) => a + b, 0)}%).`; err.hidden = false; return; }
      const config = { ...cur,
        fee: n("cf-fee"), installments: n("cf-inst"), first_month: n("cf-fm"), weekday: n("cf-wd"), top_n: n("cf-top"),
        cash: { buyin: n("cf-cb"), chips: n("cf-cc"), limit: n("cf-cl") },
        final_cash: { buyin: n("cf-fcb"), chips: n("cf-fcc"), limit: n("cf-fcl") },
        tourney: { buyin: n("cf-tb"), rebuy: n("cf-tr"), split: ts },
        final_tourney: { buyin: n("cf-ftb"), rebuy: n("cf-ftr"), split: fts },
        prizes: { cash: list("cf-pc"), tourney: list("cf-pt") },
        special: { quadra: n("cf-hq"), straight_flush: n("cf-hs"), royal: n("cf-hr") } };
      await api.update("seasons", s.id, { config }); toast(`Regras de ${s.year} salvas`); render();
    }
    if (f.id === "stmt-form"){
      const val = id => document.getElementById(id).value;
      const err = document.getElementById("st-err");
      const file = document.getElementById("st-file").files[0];
      const balance = parseMoney(val("st-bal"));
      const yieldRaw = val("st-yield").trim(), yieldV = yieldRaw ? parseMoney(yieldRaw) : 0;
      if (isNaN(balance)){ err.textContent = "Não entendi o saldo. Escreva só o número, por exemplo 12.345,67."; err.hidden = false; return; }
      if (isNaN(yieldV)){ err.textContent = "Não entendi o rendimento. Escreva só o número, por exemplo 98,40."; err.hidden = false; return; }
      const row = { season_id: S.seasonId, ref_date: val("st-date"), balance, yield: yieldV,
        investment: val("st-inv").trim() || null, notes: val("st-notes").trim() || null };
      const editId = S.editStmt;
      S.busy = true; render();
      if (file){ const safe = file.name.normalize("NFD").replace(/[^\w.-]+/g, "_"); row.file_path = `${season().year}/${Date.now()}-${safe}`; await api.upload(file, row.file_path); }
      if (editId) await api.update("statements", editId, row);
      else await api.insert("statements", { file_path: null, ...row });
      S.busy = false; S.editStmt = null; toast(`Extrato salvo: saldo ${brl(balance)}`); render();
    }
  } catch(err){ S.busy = false; toast("Erro: " + (err.message || err)); render(); }
});

// =====================================================================
// INÍCIO
// =====================================================================
async function createSeason(year){
  const ex = S.seasons.find(x => x.year === year);
  if (ex){ S.seasonId = ex.id; toast(`A temporada ${year} já existe`); return render(); }
  const cur = season();
  const ns = await api.insert("seasons", { year, name: `Poker do Serafim ${year}`, config: cur?.config || {}, host_order: cur?.host_order || [] });
  S.seasonId = ns.id; S.editing = null; S.openEvent = null; toast(`Temporada ${year} criada`); render();
}
function pickSeason(){
  if (S.seasons.find(s => s.id === S.seasonId)) return;
  const y = today().getFullYear();
  const sorted = [...S.seasons].sort((a,b) => b.year - a.year);
  S.seasonId = (sorted.find(s => s.year <= y && S.events.some(e => e.season_id === s.id)) || sorted.find(s => s.year === y) || sorted[0])?.id ?? null;
}
async function afterLogin(session){
  try { await api.loadAll(); }
  catch(e){ S.loginMsg = "Não foi possível carregar os dados: " + e.message; S.me = null; return render(); }
  const email = (session.user.email || "").toLowerCase();
  const me = S.players.find(p => (p.email || "").toLowerCase() === email && p.active !== false);
  if (!me){ S.loginMsg = `O e-mail ${email} ainda não está cadastrado no grupo. Peça ao administrador para incluir.`; await sb.auth.signOut(); S.me = null; return render(); }
  S.me = { email, admin: !!me.is_admin, player: me };
  pickSeason(); render();
}
async function init(){
  if (DEMO){ S.me = { email: "demo", admin: true }; await api.loadAll(); pickSeason(); render(); return; }
  if (!window.supabase){ document.getElementById("app").innerHTML = `<div class="wrap"><p class="err" style="margin-top:40px">Não foi possível carregar a biblioteca do Supabase. Verifique a conexão e recarregue a página.</p></div>`; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (session) await afterLogin(session); else render();
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT"){ S.me = null; render(); } });
}

// ---------- dados de exemplo (só no modo demonstração) ----------
function demoSeed(){
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const names = ["André","Bruno","Carlos","Daniel","Eduardo","Fábio","Gustavo","Henrique","Igor","Júlio"];
  const players = names.map((n,i) => ({ id: i+1, name: n + " (exemplo)", email: `jogador${i+1}@exemplo.com`, is_admin: i === 0, active: true, address: `Rua das Flores, ${100 + i*12}` }));
  const year = today().getFullYear();
  const seasons = [{ id: 1, year, name: `Exemplo ${year}`, config: { first_month: 1 }, host_order: players.map(p => p.id) }];
  const events = [], cash = [], tourney = [], hands = [];
  const start = new Date(year, 6, 2); // primeira quinta de julho (aprox.)
  while (start.getDay() !== 4) start.setDate(start.getDate() + 1);
  let id = 1, hostIdx = 0;
  for (let d = new Date(start); d < today(); d.setDate(d.getDate() + 7)){
    const evId = id++;
    events.push({ id: evId, season_id: 1, date: iso(d), host_id: players[hostIdx].id, is_final: false, status: "realizado", notes: null });
    hostIdx = (hostIdx + 1) % players.length;
    const present = players.filter(() => rnd() > 0.25).map(p => p.id);
    if (present.length < 4) present.push(...players.slice(0, 4).map(p => p.id).filter(x => !present.includes(x)));
    const buys = present.map(() => 1 + Math.floor(rnd() * 3.4) + (rnd() > 0.95 ? 5 : 0));
    const total = buys.reduce((a,b) => a + b, 0) * 5000;
    const w = present.map(() => rnd() ** 1.6); const ws = w.reduce((a,b) => a + b, 0);
    let chips = w.map(x => Math.round(total * x / ws / 100) * 100); chips[0] += total - chips.reduce((a,b) => a + b, 0);
    present.forEach((pid,i) => cash.push({ event_id: evId, player_id: pid, buyins: buys[i], final_chips: chips[i], hours_ok: rnd() > 0.04 }));
    const order = [...present].sort(() => rnd() - 0.5);
    order.forEach((pid,i) => tourney.push({ event_id: evId, player_id: pid, position: i + 1, rebuy: rnd() > 0.7 }));
    if (rnd() > 0.8) hands.push({ id: hands.length + 1, event_id: evId, player_id: present[Math.floor(rnd()*present.length)], kind: "quadra" });
  }
  const payments = [];
  const curMonth = today().getMonth() + 1;
  players.forEach(p => { for (let i = 1; i <= Math.min(10, curMonth); i++){ if (rnd() > (i >= curMonth - 1 ? 0.35 : 0.06)) payments.push({ season_id: 1, player_id: p.id, installment: i, paid_on: iso(new Date(year, i-1, 10)), amount: 200 }); } });
  const paidBy = m => payments.filter(p => p.installment <= m).length * 200;
  const statements = [];
  for (const m of [curMonth - 3, curMonth - 2, curMonth - 1].filter(m => m >= 1)){
    statements.push({ id: statements.length + 1, season_id: 1, ref_date: iso(new Date(year, m, 0)), balance: Math.round(paidBy(m) * (1 + 0.0085 * m) * 100) / 100, yield: Math.round(paidBy(m) * 0.0085 * 100) / 100, investment: "CDB liquidez diária 100% CDI", notes: null, file_path: null });
  }
  return { players, seasons, events, cash, tourney, hands, payments, statements, seasonId: null };
}

init();
