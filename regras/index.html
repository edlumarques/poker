<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regras · Poker do Serafim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f3ef; --surface:#ffffff; --surface-2:#f6f7f3; --ink:#17221b; --muted:#5d6b62; --line:#dde3db;
  --felt:#173e2a; --felt-2:#1f4d35; --felt-ink:#eef3ea; --gold:#a07c26; --gold-soft:#f3e8cc;
  --good:#2c7549; --good-soft:#e0efe5; --bad:#ad3e2d; --bad-soft:#f6e0db;
  --f-display:"Young Serif", Georgia, serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1410; --surface:#151f19; --surface-2:#1a261f; --ink:#e3eae4; --muted:#93a399; --line:#26332a;
    --felt:#0f2a1c; --felt-2:#153624; --felt-ink:#e8eee5; --gold:#d4ae58; --gold-soft:#372f1d;
    --good:#6cbf8c; --good-soft:#1b3224; --bad:#e3826f; --bad-soft:#3a201b; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{background:var(--felt);color:var(--felt-ink);background-image:radial-gradient(ellipse at 20% 0%, var(--felt-2), transparent 70%);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{padding-block:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.brand .suits{color:var(--gold);letter-spacing:4px;font-size:14px}
.top a,.top select{color:var(--felt-ink);background:transparent;border:1px solid color-mix(in srgb, var(--felt-ink) 30%, transparent);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;text-decoration:none}
.top select option{color:#17221b;background:#fff}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main.wrap{padding-block:24px calc(60px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.intro h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 4px}
.intro p{margin:0;color:var(--muted)}
nav.toc{display:flex;flex-wrap:wrap;gap:6px}
nav.toc a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px}
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;scroll-margin-top:12px}
section h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
section h3 .n{font-family:var(--f-num);font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:1px 7px}
section h4{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
b,strong{font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 6px}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact .v{font-family:var(--f-num);font-weight:600;font-size:18px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
.callout{background:var(--gold-soft);border-radius:8px;padding:10px 14px;font-size:15px;margin-top:10px}
.note{font-size:13px;color:var(--muted)}
footer{font-size:13px;color:var(--muted);text-align:center}
@media print{.top .ctl,nav.toc{display:none} section{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Poker do Serafim</h1><span class="suits" aria-hidden="true">♠ ♥ ♦ ♣</span></div>
  <div class="ctl">
    <select id="season" aria-label="Temporada" hidden></select>
    <a href="/">Voltar ao campeonato</a>
  </div>
</div></header>
<main class="wrap" id="main" aria-live="polite"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Mesmo projeto Supabase do app principal. Quem já entrou no campeonato
// vê as regras salvas de cada temporada; sem login, vale o Regulamento 2027.
const SUPABASE_URL = "https://okvzujswoziqsnapwdtq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9rdnp1anN3b3ppcXNuYXB3ZHRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDAzNjgsImV4cCI6MjEwNzkxNjM2OH0.s8QTn3xBpKv3fXFX4JNk6w1TCWTqaVK4snQpTroqI0A";

const DEFAULT_CFG = {
  fee: 200, installments: 10, first_month: 1, weekday: 4, top_n: 15,
  cash:          { buyin: 50,  chips: 5000,  limit: 7 },
  final_cash:    { buyin: 100, chips: 10000, limit: 6 },
  tourney:       { buyin: 150, rebuy: 150, split: [50, 30, 20] },
  final_tourney: { buyin: 500, rebuy: 500, split: [60, 30, 10] },
  prizes:        { cash: [5000, 3000, 2000], tourney: [5000, 3000, 2000] },
  special:       { quadra: 20, straight_flush: 50, royal: 100 }
};
const WD = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const WDP = ["domingos","segundas","terças","quartas","quintas","sextas","sábados"];
const MONL = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL", minimumFractionDigits: Number(n) % 1 ? 2 : 0});
const fnum = n => (Number(n)||0).toLocaleString("pt-BR");
const ord = i => `${i}º`;

function merge(c){
  const out = JSON.parse(JSON.stringify(DEFAULT_CFG));
  for (const k in (c || {})){
    if (c[k] && typeof c[k] === "object" && !Array.isArray(c[k])) out[k] = { ...out[k], ...c[k] };
    else out[k] = c[k];
  }
  return out;
}
function prizeRows(list){ return list.map((v,i) => `<tr><td>${ord(i+1)} lugar</td><td class="r num">${brl(v)}</td></tr>`).join(""); }
function splitText(split){ return split.map((p,i) => `${ord(i+1)} ${fnum(p)}%`).join(" · "); }

function render(c, label){
  const lastMonth = MONL[(Number(c.first_month) - 1 + Number(c.installments) - 1) % 12];
  const sumPrize = [...c.prizes.cash, ...c.prizes.tourney].reduce((a,b) => a + b, 0);
  document.getElementById("main").innerHTML = `
  <div class="intro">
    <h2>Regras do campeonato</h2>
    <p>${label}</p>
  </div>
  <nav class="toc" aria-label="Seções">
    <a href="#encontros">Encontros</a><a href="#pontos">Pontuação</a><a href="#cash">Cash game</a><a href="#torneio">Torneio</a><a href="#final">Dia final</a><a href="#premios">Prêmios</a><a href="#maos">Mãos especiais</a><a href="#mensalidades">Mensalidades</a>
  </nav>

  <section id="encontros"><h3><span class="n">1</span>Encontros e rodízio de casas</h3>
    <ul>
      <li>O grupo se reúne toda <b>${WD[c.weekday]}</b>. Cada noite tem <b>um cash game e um torneio</b>, com pontuações separadas.</li>
      <li>O encontro acontece na casa de um jogador, em rodízio. A próxima casa é a de quem recebeu menos vezes na temporada; em empate, vale a ordem fixa do rodízio.</li>
      <li>Se uma semana for trocada de casa, quem foi pulado volta a ser o próximo.</li>
    </ul>
  </section>

  <section id="pontos"><h3><span class="n">2</span>Pontuação</h3>
    <ul>
      <li>Pontuam só os presentes. O <b>1º do dia recebe tantos pontos quanto o número de presentes</b>; o 2º recebe um a menos, e assim por diante, até o último, que recebe <b>1 ponto</b>.</li>
      <li>Quem não foi recebe <b>0</b>.</li>
      <li>Cash game e torneio são dois campeonatos independentes, cada um com seu ranking.</li>
    </ul>
    <div class="callout">Exemplo: com 8 presentes, o 1º leva 8 pontos, o 2º leva 7… e o 8º leva 1.</div>
    <h4>O que conta no ranking</h4>
    <ul>
      <li>Valem as <b>${c.top_n} melhores semanas</b> de cada jogador. As demais são descartadas.</li>
      <li>O <b>dia final vale em dobro</b> e não pode ser descartado.</li>
      <li>Total = ${c.top_n} melhores semanas + dia final em dobro.</li>
      <li>Empate no total é decidido pela <b>soma de todas as semanas jogadas</b>, sem descarte.</li>
    </ul>
  </section>

  <section id="cash"><h3><span class="n">3</span>Cash game</h3>
    <div class="facts">
      <div class="fact"><div class="k">Cacife</div><div class="v">${brl(c.cash.buyin)}</div></div>
      <div class="fact"><div class="k">Fichas por cacife</div><div class="v">${fnum(c.cash.chips)}</div></div>
      <div class="fact"><div class="k">Limite</div><div class="v">${c.cash.limit} cacifes</div></div>
    </div>
    <ul>
      <li>A classificação do dia é pelo <b>resultado</b>: valor das fichas no fim menos o que foi gasto em cacifes.</li>
      <li>Quem <b>passar de ${c.cash.limit} cacifes</b> ou <b>jogar menos de 2 horas</b> fica com <b>0 ponto</b> naquela semana e vai para o fim da classificação.</li>
      <li>No fim da noite, as fichas contadas precisam bater com as fichas compradas.</li>
    </ul>
  </section>

  <section id="torneio"><h3><span class="n">4</span>Torneio</h3>
    <div class="facts">
      <div class="fact"><div class="k">Buy-in</div><div class="v">${brl(c.tourney.buyin)}</div></div>
      <div class="fact"><div class="k">Re-buy</div><div class="v">${brl(c.tourney.rebuy)}</div></div>
    </div>
    <ul>
      <li>Re-buy permitido <b>até o 2º nível de blinds</b>.</li>
      <li>A posição final define os pontos: o campeão do dia é o 1º, e quem sai primeiro fica com a última posição.</li>
      <li>O prêmio do dia é a soma dos buy-ins e re-buys, dividido assim: <b>${splitText(c.tourney.split)}</b>.</li>
    </ul>
  </section>

  <section id="final"><h3><span class="n">5</span>Dia final</h3>
    <ul>
      <li>Pontos <b>em dobro</b> no cash e no torneio, sem descarte.</li>
      <li>Cash: cacife de <b>${brl(c.final_cash.buyin)}</b> = ${fnum(c.final_cash.chips)} fichas, limite de <b>${c.final_cash.limit} cacifes</b>.</li>
      <li>Torneio: buy-in de <b>${brl(c.final_tourney.buyin)}</b>, re-buy de ${brl(c.final_tourney.rebuy)}. Prêmio do dia: <b>${splitText(c.final_tourney.split)}</b>.</li>
    </ul>
  </section>

  <section id="premios"><h3><span class="n">6</span>Prêmios do campeonato</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
      <div class="tbl"><h4 style="margin-top:0">Cash game</h4><table><tbody>${prizeRows(c.prizes.cash)}</tbody></table></div>
      <div class="tbl"><h4 style="margin-top:0">Torneio</h4><table><tbody>${prizeRows(c.prizes.tourney)}</tbody></table></div>
    </div>
    <p class="note" style="margin:10px 0 0">Total em prêmios: ${brl(sumPrize)}, pagos com o caixa das mensalidades.</p>
  </section>

  <section id="maos"><h3><span class="n">7</span>Mãos especiais</h3>
    <p style="margin:0 0 6px">Feitas com as <b>duas cartas da mão</b>. Quem fizer recebe o valor abaixo <b>de cada um dos outros presentes</b>.</p>
    <div class="tbl"><table><thead><tr><th>Mão</th><th class="r">Cada presente paga</th></tr></thead><tbody>
      <tr><td>Quadra</td><td class="r num">${brl(c.special.quadra)}</td></tr>
      <tr><td>Straight flush</td><td class="r num">${brl(c.special.straight_flush)}</td></tr>
      <tr><td>Royal straight flush</td><td class="r num">${brl(c.special.royal)}</td></tr>
    </tbody></table></div>
  </section>

  <section id="mensalidades"><h3><span class="n">8</span>Mensalidades</h3>
    <div class="facts">
      <div class="fact"><div class="k">Valor</div><div class="v">${brl(c.fee)}</div></div>
      <div class="fact"><div class="k">Parcelas</div><div class="v">${c.installments}×</div></div>
      <div class="fact"><div class="k">Total por jogador</div><div class="v">${brl(c.fee * c.installments)}</div></div>
    </div>
    <ul>
      <li>De <b>${MONL[Number(c.first_month) - 1]}</b> a <b>${lastMonth}</b>, com vencimento no último dia de cada mês.</li>
      <li>O dinheiro fica aplicado no caixa do campeonato, e os extratos podem ser vistos na aba Caixa.</li>
    </ul>
  </section>

  <footer>Sem login, esta página mostra o Regulamento 2027. Quem já entrou no app vê as regras salvas de cada temporada.</footer>`;
}

async function init(){
  render(DEFAULT_CFG, "Regulamento 2027.");
  if (!window.supabase) return;
  try {
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return;
    const { data, error } = await sb.from("seasons").select("id,year,config").order("year", { ascending: false });
    if (error || !data?.length) return;
    const sel = document.getElementById("season");
    const y = new Date().getFullYear();
    const pick = (data.find(s => s.year === y) || data[0]).id;
    sel.innerHTML = data.map(s => `<option value="${s.id}" ${s.id === pick ? "selected" : ""}>Temporada ${s.year}</option>`).join("");
    sel.hidden = false;
    const show = id => { const s = data.find(x => x.id === Number(id)); render(merge(s.config), `Temporada ${s.year}, conforme as regras salvas no app.`); };
    sel.addEventListener("change", e => show(e.target.value));
    show(pick);
  } catch(e){ /* sem conexão: fica o regulamento padrão */ }
}
init();
</script>
</body>
</html>
